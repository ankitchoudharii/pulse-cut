name: Build PulseCut Pro Android Tablet APK

on:
  push:
    branches: [ "main", "master", "**" ]
  workflow_dispatch:

jobs:
  build-tablet-apk:
    name: Build Installable Android Tablet APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Unpack ZIP & Auto-Repair Project Files
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            for z in *.zip */*.zip; do
              if [ -f "$z" ]; then
                echo "Unpacking $z..."
                unzip -o "$z" -d .
              fi
            done
          fi
          if [ ! -f "settings.gradle.kts" ]; then
            echo "ERROR: PulseCutPro-Android-Tablet-NLE.zip was not found in your repository!"
            echo "Please tap Add file -> Upload files in your GitHub repo and upload PulseCutPro-Android-Tablet-NLE.zip."
            exit 1
          fi
          rm -rf gradlew gradlew.bat gradle
          if [ -f "app/src/main/res/values/themes.xml" ]; then
            sed -i 's/#FF0D0F14/@color\/nle_bg/g' app/src/main/res/values/themes.xml
          fi
          if [ -f "app/src/main/java/com/pulsecut/pro/speech/SubtitleFormatIO.kt" ]; then
            python3 -c '
          p = "app/src/main/java/com/pulsecut/pro/speech/SubtitleFormatIO.kt"
          t = open(p).read().replace("Regex(\"\\n\\s*\\n\")", "Regex(\"\\\\n\\\\s*\\\\n\")")
          open(p, "w").write(t)
          '
          fi
          if [ -f "app/src/main/java/com/pulsecut/pro/speech/WhistleNativeBridge.kt" ]; then
            sed -i 's/decodeFromString<WhistleTranscriptResult>(rawJson)/decodeFromString(WhistleTranscriptResult.serializer(), rawJson)/g' app/src/main/java/com/pulsecut/pro/speech/WhistleNativeBridge.kt
          fi
          if [ -f "app/src/main/java/com/pulsecut/pro/model/RichTextModels.kt" ]; then
            sed -i 's/0x00000000,/0x00000000L,/g; s/0x6600D2FF,/0x6600D2FFL,/g' app/src/main/java/com/pulsecut/pro/model/RichTextModels.kt
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install NDK / CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "platforms;android-34" "build-tools;34.0.0" "ndk;26.1.10909125" "cmake;3.22.1" > /dev/null 2>&1 || true

      - name: Bundle Cactus Whistle 16.9 MB Model (whistle.cact)
        continue-on-error: true
        run: |
          mkdir -p app/src/main/assets/models
          curl -L --fail --retry 3 \
            "https://huggingface.co/Cactus-Compute/whistle/resolve/main/whistle.cact" \
            -o app/src/main/assets/models/whistle.cact || echo "Using on-device downloader"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          validate-wrappers: false

      - name: Compile APK
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Installable Tablet APK
        uses: actions/upload-artifact@v4
        with:
          name: PulseCutPro-Tablet-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
